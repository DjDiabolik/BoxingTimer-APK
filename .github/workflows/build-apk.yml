name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il repository
        uses: actions/checkout@v4

      - name: 2. Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configura Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 4. Estrai il nome dinamico dal manifest.json
        run: |
          RAW_NAME=$(jq -r '.name // "Boxing Timer"' manifest.json)
          CLEAN_NAME=$(echo "$RAW_NAME" | sed 's/ /-/g')
          echo "APK_FILENAME=${CLEAN_NAME}.apk" >> $GITHUB_ENV
          echo "APP_NAME_STRING=${RAW_NAME}" >> $GITHUB_ENV
          echo "Nome estratto: ${RAW_NAME}"

      - name: 5. Prepara i file web
        run: |
          mkdir -p www
          cp index.html www/
          cp -r *.html *.png *.json *.js www/ 2>/dev/null || true

      - name: 6. Installa Capacitor e configura il progetto
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # Configura la SplashScreen senza stretching (CENTER_INSIDE) e sfondo scuro
          cat << EOF_CONF > capacitor.config.json
          {
            "appId": "com.djdiabolik.boxingtimer",
            "appName": "${APP_NAME_STRING}",
            "webDir": "www",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1000,
                "launchAutoHide": true,
                "backgroundColor": "#121212",
                "androidScaleType": "CENTER_INSIDE",
                "showSpinner": false
              }
            }
          }
          EOF_CONF

          npx cap add android
          npx cap sync android

      - name: 7. Imposta icona, splash screen e tema scuro nativo
        run: |
          # 1. Nome dell'app
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME_STRING}</string>|g" android/app/src/main/res/values/strings.xml

          # 2. Icone del launcher di Android
          for dir in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            cp icon.png "$dir/ic_launcher.png"
            cp icon.png "$dir/ic_launcher_round.png"
            cp maskable_icon_x512.png "$dir/ic_launcher_foreground.png" 2>/dev/null || cp icon.png "$dir/ic_launcher_foreground.png"
          done

          # 3. Sostituisce le immagini della Splash Screen
          find android/app/src/main/res -name "splash.png" -exec cp icon.png {} \;

          # 4. Elimina il flash bianco del tema Android impostando lo sfondo nativo #121212
          sed -i 's|<item name="android:background">.*</item>|<item name="android:background">#121212</item>|g' android/app/src/main/res/values/styles.xml 2>/dev/null || true

          # 5. Sfondo scuro per icone adattive
          cat << 'EOF_BG' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#121212</color>
          </resources>
          EOF_BG

      - name: 8. Inietta WakeLock hardware nativo
        run: |
          cat << 'EOF_WL' > android/app/src/main/java/com/djdiabolik/boxingtimer/MainActivity.java
          package com.djdiabolik.boxingtimer;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          EOF_WL

      - name: 9. Compila l'APK nativo con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 10. Rinomina APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ${{ env.APK_FILENAME }}

      - name: 11. Carica l'APK come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILENAME }}
          path: ${{ env.APK_FILENAME }}

      - name: 12. Allega l'APK alla Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILENAME }}
