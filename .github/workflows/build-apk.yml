name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il repository
        uses: actions/checkout@v4

      - name: 2. Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configura Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 4. Estrai il nome dinamico dal manifest.json
        run: |
          RAW_NAME=$(jq -r '.name // "Boxing Timer"' manifest.json)
          CLEAN_NAME=$(echo "$RAW_NAME" | sed 's/ /-/g')
          echo "APK_FILENAME=${CLEAN_NAME}.apk" >> $GITHUB_ENV
          echo "APP_NAME_STRING=${RAW_NAME}" >> $GITHUB_ENV

      - name: 5. Prepara i file web
        run: |
          mkdir -p www
          cp index.html www/
          cp -r *.html *.png *.json *.js www/ 2>/dev/null || true

      - name: 6. Installa Capacitor e configura il progetto
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest @capacitor/share@latest

          cat << EOF_CONF > capacitor.config.json
          {
            "appId": "com.djdiabolik.boxingtimer",
            "appName": "${APP_NAME_STRING}",
            "webDir": "www"
          }
          EOF_CONF

          npx cap add android
          npx cap sync android
          npx cap copy

      - name: 6b. Copia runtime Capacitor se presente
        run: |
          if [ -f android/app/src/main/assets/www/capacitor.js ]; then
            cp android/app/src/main/assets/www/capacitor.js www/
          fi

      - name: 7. Imposta icona nativa e Splash Screen con layer-list
        run: |
          # 1. Nome app
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME_STRING}</string>|g" android/app/src/main/res/values/strings.xml

          # 2. Sostituisce le icone del launcher
          for dir in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            cp icon.png "$dir/ic_launcher.png"
            cp icon.png "$dir/ic_launcher_round.png"
            cp maskable_icon_x512.png "$dir/ic_launcher_foreground.png" 2>/dev/null || cp icon.png "$dir/ic_launcher_foreground.png"
          done

          # 3. Elimina tutti i vecchi splash.png per evitare conflitti di duplicati in Gradle
          find android/app/src/main/res -name "splash.png" -delete

          # 4. Sfondo scuro per le icone
          cat << 'EOF_BG' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#121212</color>
          </resources>
          EOF_BG

          # 5. Crea il layer-list con sfondo scuro e icona centrata a 128dp
          cat << 'EOF_SPLASH' > android/app/src/main/res/drawable/splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/ic_launcher_background"/>
              <item
                  android:gravity="center"
                  android:width="128dp"
                  android:height="128dp"
                  android:drawable="@mipmap/ic_launcher"/>
          </layer-list>
          EOF_SPLASH

          # 6. Ripristina il riferimento a @drawable/splash nel tema
          # (SOLO nel tema di avvio NoActionBarLaunch: se lo si applica anche a AppTheme.NoActionBar
          #  lo sfondo con l'icona finisce in tutti i popup/dialog di sistema)
          sed -i '/name="AppTheme.NoActionBarLaunch"/,/<\/style>/ s|<item name="android:background">.*</item>|<item name="android:background">@drawable/splash</item>|' android/app/src/main/res/values/styles.xml 2>/dev/null || true

      - name: 8. Inietta WakeLock hardware nativo e plugin salvataggio in Download
        run: |
          cat << 'EOF_FS' > android/app/src/main/java/com/djdiabolik/boxingtimer/FileSaverPlugin.java
          package com.djdiabolik.boxingtimer;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "FileSaver")
          public class FileSaverPlugin extends Plugin {

              // Salva un file di testo nella cartella pubblica "Download" (come fa Chrome con i download)
              @PluginMethod
              public void save(PluginCall call) {
                  String filename = call.getString("filename");
                  String data = call.getString("data");
                  if (filename == null || filename.isEmpty() || data == null) {
                      call.reject("Parametri mancanti");
                      return;
                  }
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      // Android 9 e precedenti: serve un permesso di scrittura, si ripiega sul menu Condividi
                      call.reject("LEGACY_ANDROID");
                      return;
                  }
                  filename = filename.replaceAll("[\\\\/:*?\"<>|]", "_");

                  ContentResolver resolver = getContext().getContentResolver();
                  Uri uri = null;
                  try {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) {
                          call.reject("Impossibile creare il file in Download");
                          return;
                      }

                      OutputStream out = resolver.openOutputStream(uri);
                      if (out == null) {
                          throw new IOException("Impossibile aprire il file in scrittura");
                      }
                      try {
                          out.write(data.getBytes(StandardCharsets.UTF_8));
                          out.flush();
                      } finally {
                          out.close();
                      }

                      ContentValues done = new ContentValues();
                      done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      resolver.update(uri, done, null, null);

                      // Se esisteva gia' un file con lo stesso nome Android ne aggiunge uno nuovo (es. "nome (1).json")
                      String savedName = filename;
                      Cursor cursor = resolver.query(uri, new String[] { MediaStore.MediaColumns.DISPLAY_NAME }, null, null, null);
                      if (cursor != null) {
                          try {
                              if (cursor.moveToFirst()) {
                                  savedName = cursor.getString(0);
                              }
                          } finally {
                              cursor.close();
                          }
                      }

                      JSObject ret = new JSObject();
                      ret.put("name", savedName);
                      call.resolve(ret);
                  } catch (Exception e) {
                      if (uri != null) {
                          try {
                              resolver.delete(uri, null, null);
                          } catch (Exception ignored) {
                          }
                      }
                      call.reject("Errore nel salvataggio: " + e.getMessage());
                  }
              }
          }
          EOF_FS

          cat << 'EOF_WL' > android/app/src/main/java/com/djdiabolik/boxingtimer/MainActivity.java
          package com.djdiabolik.boxingtimer;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FileSaverPlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          EOF_WL

      - name: 9. Compila l'APK nativo con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 10. Rinomina APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ${{ env.APK_FILENAME }}

      - name: 11. Carica l'APK come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILENAME }}
          path: ${{ env.APK_FILENAME }}

      - name: 12. Allega l'APK alla Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILENAME }}
